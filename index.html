<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WOAH Shop · WOAH Festival merch</title>
<meta name="description" content="Official WOAH Festival merch, designed and sold by students at Green School Bali. Buy what's in stock or pre-order the new drops.">
<meta name="theme-color" content="#5D9998">
<link rel="icon" href="img/icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;400;500&family=Mulish:wght@300;400;600;700&display=swap">
<style>
  :root {
    --navy: #21486B; --navy-2: #1A3A57; --teal: #5D9998; --aqua: #7CCCCB; --pale: #B9E6E5; --cream: #F5EDE5;
    --ink: #312F2E; --muted: #8C8A88; --line: #E6E1DB; --bg: #FFFFFF; --soft: #F7F5F2;
    --ok: #3F8A88; --low: #C2603F; --out: #9A3B32;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.65 "Mulish", "Avenir Next", Avenir, system-ui, sans-serif; font-weight: 400; -webkit-font-smoothing: antialiased; }
  a { color: inherit; }
  button { font: inherit; cursor: pointer; }
  img { max-width: 100%; display: block; }
  .wrap { max-width: 1120px; margin: 0 auto; padding: 0 16px; }
  .os { font-family: "Oswald", "DIN Condensed", "Arial Narrow", sans-serif; }
  :focus-visible { outline: 2px solid var(--aqua); outline-offset: 3px; }

  /* nav bar: teal, white logo, tracked uppercase links (like the WOAH website) */
  .bar { position: sticky; top: 0; z-index: 20; background: var(--teal); color: #fff; box-shadow: 0 1px 0 rgba(0,0,0,.08); }
  .bar .wrap { display: flex; align-items: center; justify-content: space-between; gap: 12px; height: 66px; }
  .brand img { height: 46px; width: auto; }
  .bar nav { display: flex; align-items: center; gap: 2px; }
  .bar nav a, .bar nav button { font-family: "Oswald", sans-serif; font-weight: 400; font-size: 15px; letter-spacing: .06em; text-transform: uppercase; color: #fff; text-decoration: none; background: none; border: 0; padding: 8px 14px; opacity: .92; }
  .bar nav a:hover, .bar nav button:hover { opacity: 1; color: var(--navy); }
  .bar .bag { display: inline-flex; align-items: center; gap: 7px; border: 1px solid rgba(255,255,255,.7) !important; margin-left: 8px; }
  .bar .bag b { font-family: "Mulish", sans-serif; font-size: 11px; font-weight: 700; background: #fff; color: var(--navy); min-width: 19px; height: 19px; display: inline-flex; align-items: center; justify-content: center; padding: 0 5px; }
  @media (max-width: 640px) { .bar nav .hide-s { display: none; } .brand img { height: 38px; } }

  /* hero: deep navy, big tracked title, paper collage banner */
  .hero { background: var(--navy-2); color: #fff; text-align: center; position: relative; overflow: hidden; }
  .hero::before { content: ""; position: absolute; inset: 0; background: radial-gradient(70% 90% at 50% 0%, rgba(124,204,203,.22), transparent 70%); }
  .hero .wrap { position: relative; padding-top: 64px; padding-bottom: 70px; }
  .hero .pre { font-family: "Oswald", sans-serif; font-weight: 400; font-size: clamp(15px, 2vw, 19px); letter-spacing: .32em; text-transform: uppercase; color: var(--pale); }
  .hero h1 { font-family: "Oswald", sans-serif; font-weight: 500; font-size: clamp(46px, 9vw, 92px); letter-spacing: .14em; line-height: 1; margin: 14px 0 22px; text-transform: uppercase; }
  .hero p { max-width: 620px; margin: 0 auto 30px; color: rgba(255,255,255,.86); font-weight: 300; font-size: 17px; }
  .cta { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; font-family: "Oswald", sans-serif; font-weight: 400; font-size: 15px; letter-spacing: .12em; text-transform: uppercase; text-decoration: none; padding: 12px 26px; border: 1px solid currentColor; background: transparent; color: inherit; transition: background .2s, color .2s; }
  .btn.light { color: #fff; } .btn.light:hover { background: #fff; color: var(--navy); }
  .btn.solid { background: var(--navy); color: #fff; border-color: var(--navy); } .btn.solid:hover:not([disabled]) { background: var(--teal); border-color: var(--teal); }
  .btn[disabled] { opacity: .5; cursor: not-allowed; }

  /* torn-paper banner band (pre-order call-out) */
  .band { background: var(--teal); padding: 34px 16px; display: flex; justify-content: center; }
  .paper { position: relative; display: inline-flex; align-items: center; justify-content: center; text-align: center; min-height: 120px; padding: 26px 56px; color: #fff; text-decoration: none; background: url("img/paper-banner.png") center / 100% 100% no-repeat; filter: drop-shadow(0 6px 14px rgba(0,0,0,.18)); transition: transform .25s; max-width: 100%; }
  @media (max-width: 560px) { .paper { padding: 22px 34px; min-height: 96px; } }
  .paper:hover { transform: rotate(-1deg) scale(1.02); }
  .paper span { font-family: "Oswald", sans-serif; font-weight: 400; font-size: clamp(22px, 3.4vw, 32px); letter-spacing: .08em; text-transform: uppercase; line-height: 1.2; text-shadow: 0 1px 6px rgba(0,0,0,.35); }
  .paper span u { text-underline-offset: 4px; }

  /* section titles with the arrow dividers */
  main { padding-bottom: 70px; }
  .sec { padding-top: 64px; scroll-margin-top: 70px; }
  .title { text-align: center; margin-bottom: 36px; }
  .title h2 { display: inline-flex; align-items: center; gap: 18px; margin: 0; font-family: "Oswald", sans-serif; font-weight: 500; font-size: clamp(30px, 5vw, 48px); letter-spacing: .16em; text-transform: uppercase; color: var(--navy); line-height: 1.1; }
  .title h2 svg { width: 70px; height: 14px; flex: 0 0 auto; color: var(--navy); }
  .title .sub { font-family: "Oswald", sans-serif; font-size: clamp(13px, 1.8vw, 17px); letter-spacing: .24em; text-transform: uppercase; color: var(--navy); margin-top: 8px; }
  .title p { color: var(--muted); max-width: 560px; margin: 10px auto 0; font-weight: 300; }
  @media (max-width: 560px) { .title h2 svg { width: 34px; } .title h2 { gap: 10px; } }
  .grid { display: grid; gap: 28px 22px; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); }
  @media (max-width: 560px) { .grid { grid-template-columns: repeat(2, 1fr); gap: 20px 12px; } }
  .empty { border: 1px dashed var(--line); padding: 30px; text-align: center; color: var(--muted); grid-column: 1 / -1; }

  /* product cards: photo, name, then quiet details (like the website) */
  .pc { text-decoration: none; display: flex; flex-direction: column; text-align: center; }
  .pc .ph { aspect-ratio: 4 / 5; position: relative; overflow: hidden; background: var(--soft); }
  .pc .ph img { width: 100%; height: 100%; object-fit: cover; transition: transform .6s; }
  .pc:hover .ph img { transform: scale(1.04); }
  .tag { position: absolute; top: 12px; left: 12px; font-family: "Oswald", sans-serif; font-size: 12px; letter-spacing: .14em; text-transform: uppercase; padding: 4px 10px; background: #fff; color: var(--navy); }
  .tag.pre { background: var(--teal); color: #fff; }
  .tag.low { background: var(--low); color: #fff; }
  .tag.out { background: var(--ink); color: #fff; }
  .pc .nm { font-family: "Oswald", sans-serif; font-weight: 400; font-size: 23px; color: var(--ink); margin-top: 14px; line-height: 1.2; }
  .pc .meta { color: var(--muted); font-size: 14px; font-weight: 300; margin-top: 4px; }
  .pc .pr { color: var(--navy); font-size: 15px; font-weight: 600; margin-top: 2px; letter-spacing: .02em; }
  .pc.soldout .ph img, .pc.soldout .ph .art { filter: grayscale(.9) opacity(.7); }
  @media (max-width: 560px) { .pc .nm { font-size: 18px; } .pc .meta { font-size: 12.5px; } }

  /* placeholder when a product has no photo yet: navy + paper collage */
  .art { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; background: var(--navy); color: #fff; padding: 14px; }
  .art .scrap { width: 92%; aspect-ratio: 661 / 211; background: url("img/paper-band.png") center / 100% 100% no-repeat; display: flex; align-items: center; justify-content: center; text-align: center; padding: 0 14%; }
  .art .scrap b { font-family: "Oswald", sans-serif; font-weight: 500; letter-spacing: .1em; text-transform: uppercase; font-size: clamp(14px, 2.2vw, 22px); line-height: 1.1; text-shadow: 0 1px 6px rgba(0,0,0,.4); }
  .art small { font-family: "Oswald", sans-serif; font-size: 11px; letter-spacing: .26em; color: var(--pale); text-transform: uppercase; }

  .sk { background: linear-gradient(90deg, var(--soft) 0%, #fff 50%, var(--soft) 100%); background-size: 200% 100%; animation: sk 1.3s infinite linear; aspect-ratio: 4 / 6; }
  @keyframes sk { to { background-position: -200% 0; } }

  /* product page */
  .back { display: inline-block; margin: 26px 0 16px; text-decoration: none; color: var(--navy); font-family: "Oswald", sans-serif; font-size: 14px; letter-spacing: .14em; text-transform: uppercase; }
  .pp { display: grid; grid-template-columns: 1.1fr .9fr; gap: 44px; align-items: start; }
  @media (max-width: 860px) { .pp { grid-template-columns: 1fr; gap: 22px; } }
  .gal { position: sticky; top: 86px; }
  @media (max-width: 860px) { .gal { position: static; } }
  .gal .main { aspect-ratio: 4 / 5; overflow: hidden; background: var(--soft); position: relative; }
  .gal .main img { width: 100%; height: 100%; object-fit: cover; }
  .gal .nav { position: absolute; top: 50%; transform: translateY(-50%); width: 40px; height: 40px; border: 0; background: rgba(255,255,255,.9); color: var(--navy); font-size: 20px; }
  .gal .nav.l { left: 10px; } .gal .nav.r { right: 10px; }
  .thumbs { display: flex; gap: 8px; margin-top: 10px; overflow-x: auto; padding-bottom: 4px; }
  .thumbs button { flex: 0 0 72px; height: 72px; overflow: hidden; border: 2px solid transparent; padding: 0; background: var(--soft); }
  .thumbs button.on { border-color: var(--navy); }
  .thumbs img { width: 100%; height: 100%; object-fit: cover; }
  .pp .kick { font-family: "Oswald", sans-serif; font-size: 13px; letter-spacing: .24em; text-transform: uppercase; color: var(--teal); }
  .pp h1 { font-family: "Oswald", sans-serif; font-weight: 500; font-size: clamp(32px, 4.6vw, 48px); letter-spacing: .06em; line-height: 1.05; margin: 8px 0 12px; color: var(--navy); text-transform: uppercase; }
  .pp .price { font-size: 21px; font-weight: 600; color: var(--ink); }
  .pp .desc { color: #5b5856; margin: 16px 0 0; white-space: pre-line; font-weight: 300; }
  .opt { margin-top: 24px; }
  .opt .lbl { display: flex; justify-content: space-between; font-family: "Oswald", sans-serif; font-size: 14px; letter-spacing: .16em; text-transform: uppercase; color: var(--navy); margin-bottom: 9px; }
  .opt .lbl span { font-family: "Mulish", sans-serif; letter-spacing: 0; text-transform: none; color: var(--muted); font-size: 14px; }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; }
  .chip { min-width: 54px; padding: 10px 15px; border: 1px solid #CFC9C2; background: #fff; color: var(--ink); font-weight: 600; font-size: 14px; }
  .chip:hover:not([disabled]) { border-color: var(--navy); }
  .chip.on { background: var(--navy); border-color: var(--navy); color: #fff; }
  .chip[disabled] { opacity: .38; text-decoration: line-through; cursor: not-allowed; }
  .chip .sw { display: inline-block; width: 15px; height: 15px; border-radius: 50%; vertical-align: -2px; margin-right: 8px; border: 1px solid rgba(0,0,0,.2); }
  .chip.on .sw { border-color: rgba(255,255,255,.7); }
  .chip small { display: block; font-size: 10.5px; font-weight: 400; opacity: .75; }
  .qty { display: inline-flex; align-items: center; border: 1px solid #CFC9C2; }
  .qty button { width: 44px; height: 44px; border: 0; background: #fff; color: var(--navy); font-size: 18px; }
  .qty span { min-width: 40px; text-align: center; font-weight: 700; }
  .buy { margin-top: 28px; }
  .buy .btn { width: 100%; padding: 16px 22px; font-size: 16px; }
  .note { margin-top: 16px; padding: 14px 16px; font-size: 14.5px; background: var(--soft); border-left: 3px solid var(--teal); font-weight: 300; }
  .note b { font-weight: 700; }
  .stockline { margin-top: 10px; font-size: 14px; font-weight: 700; }
  .stockline.low { color: var(--low); } .stockline.out { color: var(--out); } .stockline.ok { color: var(--ok); }


  /* bag, checkout, orders */
  .narrow { max-width: 980px; padding-top: 46px; padding-bottom: 60px; }
  .box { background: #fff; border: 1px solid var(--line); padding: 18px; margin-bottom: 16px; position: relative; }
  .muted { color: var(--muted); font-weight: 300; }
  .bad { color: var(--out); } .good { color: var(--ok); }
  .big { font-family: "Oswald", sans-serif; font-weight: 500; font-size: 22px; letter-spacing: .06em; color: var(--navy); }
  .h3 { font-family: "Oswald", sans-serif; font-weight: 400; font-size: 17px; letter-spacing: .16em; text-transform: uppercase; color: var(--navy); margin: 26px 0 10px; }
  .bl { display: grid; grid-template-columns: 72px 1fr auto; gap: 14px; align-items: start; padding: 12px 0; border-bottom: 1px solid var(--line); }
  .bl:first-child { padding-top: 0; }
  .bl-ph { width: 72px; height: 88px; background: var(--soft); overflow: hidden; display: block; }
  .bl-ph img { width: 100%; height: 100%; object-fit: cover; }
  .mini-art { width: 100%; height: 100%; background: var(--navy); color: #fff; font-family: "Oswald", sans-serif; font-size: 9.5px; overflow-wrap: anywhere; letter-spacing: .08em; text-transform: uppercase; display: flex; align-items: center; justify-content: center; text-align: center; padding: 6px; line-height: 1.2; }
  .bl-nm { font-family: "Oswald", sans-serif; font-size: 18px; color: var(--ink); line-height: 1.2; }
  .bl-op, .bl-ty { font-size: 13.5px; color: var(--muted); }
  .bl-pr { font-weight: 700; white-space: nowrap; }
  .bl-act { display: flex; gap: 14px; align-items: center; margin-top: 8px; }
  .qty.sm button { width: 34px; height: 34px; font-size: 16px; } .qty.sm span { min-width: 30px; }
  .lnk { background: none; border: 0; padding: 0; color: var(--navy); text-decoration: underline; text-underline-offset: 3px; font-size: 14px; display: inline-block; margin-top: 12px; }
  .bl-act .lnk { margin-top: 0; }
  .tot { display: flex; justify-content: space-between; align-items: baseline; padding-top: 14px; font-size: 15px; }
  .tot b { font-size: 20px; color: var(--navy); }
  .row-btns { display: flex; gap: 12px; justify-content: flex-end; flex-wrap: wrap; margin-top: 8px; }
  .btn.dis { opacity: .45; pointer-events: none; }
  .btn.wide { width: 100%; margin-top: 10px; }
  .warnbox { border-left-color: var(--out); }
  .ck { display: grid; grid-template-columns: 1.25fr .85fr; gap: 28px; align-items: start; }
  .ck.two-col { grid-template-columns: 1fr 1fr; }
  @media (max-width: 820px) { .ck, .ck.two-col { grid-template-columns: 1fr; } }
  .ck .sum { position: sticky; top: 86px; }
  @media (max-width: 820px) { .ck .sum { position: static; } }
  .tabs { display: flex; border: 1px solid var(--line); border-bottom: 0; }
  .tabs button { flex: 1; padding: 11px 6px; background: var(--soft); border: 0; border-right: 1px solid var(--line); font-family: "Oswald", sans-serif; letter-spacing: .1em; text-transform: uppercase; font-size: 14px; color: var(--muted); }
  .tabs button:last-child { border-right: 0; }
  .tabs button.on { background: #fff; color: var(--navy); box-shadow: inset 0 3px 0 var(--teal); }
  .field { margin-bottom: 12px; }
  .field label { display: block; font-size: 13px; font-weight: 700; color: var(--ink); margin-bottom: 5px; }
  .field input, .field textarea { width: 100%; font: inherit; font-size: 16px; padding: 11px 12px; border: 1px solid #CFC9C2; background: #fff; color: var(--ink); border-radius: 0; }
  .field input:focus, .field textarea:focus { outline: none; border-color: var(--navy); box-shadow: 0 0 0 2px rgba(33,72,107,.15); }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 520px) { .two { grid-template-columns: 1fr; } }
  .hint { font-size: 13px; color: var(--muted); font-weight: 300; margin: 4px 0 10px; }
  .fmsg { font-size: 14px; margin-top: 8px; color: var(--ok); min-height: 1px; } .fmsg.bad { color: var(--out); font-weight: 600; }
  .acc { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .acc .lnk { margin: 0; }
  .cards { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  @media (max-width: 520px) { .cards { grid-template-columns: 1fr; } }
  .rc { text-align: left; background: #fff; border: 1px solid #CFC9C2; padding: 13px 14px; display: flex; flex-direction: column; gap: 3px; }
  .rc b { font-family: "Oswald", sans-serif; font-weight: 400; font-size: 17px; letter-spacing: .04em; color: var(--ink); }
  .rc span { font-size: 13px; color: var(--muted); font-weight: 300; }
  .rc:hover { border-color: var(--navy); }
  .rc.on { border-color: var(--navy); box-shadow: inset 0 0 0 1px var(--navy); background: #F3F7F9; }
  .rc.on b::before { content: "✓ "; color: var(--teal); }
  .kv { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; font-size: 14.5px; }
  .kv span { display: block; font-size: 12px; text-transform: uppercase; letter-spacing: .12em; color: var(--muted); font-family: "Oswald", sans-serif; }
  .oi > span:last-child { white-space: nowrap; }
  .oi { display: flex; justify-content: space-between; gap: 12px; padding: 6px 0; border-bottom: 1px dashed var(--line); font-size: 15px; }
  .pill { font-size: 11px; background: var(--pale); color: var(--navy); padding: 1px 7px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; }
  .paybox { display: flex; gap: 18px; align-items: center; flex-wrap: wrap; background: #fff; border: 1px solid var(--line); padding: 18px; }
  .paybox > div { flex: 1 1 260px; }
  .paybox .qr { width: 220px; height: 220px; border: 8px solid #fff; outline: 1px solid var(--line); image-rendering: pixelated; }
  .paybox .btn { flex: 0 0 auto; }
  .bank { white-space: pre-line; background: var(--soft); padding: 10px 12px; margin: 8px 0; font-weight: 600; }
  .proof { margin: 10px 0 18px; }
  .proof .btn { cursor: pointer; }
  .help { font-size: 14.5px; color: var(--muted); margin: 18px 0; }
  .help a { color: var(--navy); }
  .help.sm { border-top: 1px dashed var(--line); padding-top: 10px; margin: 12px 0 0; font-size: 13.5px; }
  .proofok { display: flex; align-items: center; gap: 12px; margin-top: 10px; font-weight: 700; color: var(--ok); }
  .proofok img { width: 64px; height: 64px; object-fit: cover; border: 1px solid var(--line); }
  .oc-h { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; margin-bottom: 8px; }
  .st { font-family: "Oswald", sans-serif; font-size: 12px; letter-spacing: .12em; text-transform: uppercase; padding: 5px 10px; background: var(--soft); color: var(--navy); white-space: nowrap; }
  .st-ready-to-collect { background: var(--teal); color: #fff; } .st-collected { background: var(--ok); color: #fff; } .st-cancelled { background: #eee; color: var(--muted); } .st-waiting-for-stock { background: var(--pale); }
  details.pay { margin-top: 12px; } details.pay summary { cursor: pointer; font-weight: 700; color: var(--navy); margin-bottom: 10px; }
  .chip.on::after { content: ""; }

  /* footer */
  footer { background: var(--navy); color: rgba(255,255,255,.85); padding: 44px 0 calc(40px + env(safe-area-inset-bottom)); font-size: 14px; font-weight: 300; text-align: center; }
  footer img { height: 66px; width: auto; margin: 0 auto 14px; }
  footer .tag-line { font-family: "Oswald", sans-serif; letter-spacing: .26em; text-transform: uppercase; font-size: 14px; color: #fff; margin-bottom: 10px; }
  footer a { color: var(--pale); }
  .toast { position: fixed; left: 50%; bottom: 22px; transform: translate(-50%, 20px); opacity: 0; visibility: hidden; transition: transform .3s, opacity .3s, visibility .3s; background: var(--navy); color: #fff; padding: 12px 18px; z-index: 50; max-width: calc(100% - 32px); font-size: 14px; box-shadow: 0 10px 30px rgba(0,0,0,.2); }
  .toast.on { transform: translate(-50%, 0); opacity: 1; visibility: visible; }
  .err { margin-top: 30px; }
  .fade { animation: fade .4s ease both; }
  @keyframes fade { from { opacity: 0; transform: translateY(8px); } }
  @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } .fade { animation: none; } }
</style>
</head>
<body>
<header class="bar">
  <div class="wrap">
    <a class="brand" href="#/" aria-label="WOAH Shop home"><img src="img/logo-white.png" alt="WOAH Festival" width="98" height="46"></a>
    <nav>
      <a class="hide-s" href="#/current">Shop now</a>
      <a class="hide-s" href="#/preorder">Pre-order</a>
      <a class="hide-s" href="#/orders">My orders</a>
      <a class="bag" href="#/bag" aria-label="Your bag">Bag <b id="bagN">0</b></a>
    </nav>
  </div>
</header>
<div id="view"></div>
<footer>
  <div class="wrap">
    <img src="img/logo-white.png" alt="WOAH Festival" width="140" height="66">
    <div class="tag-line">Designed and sold by students</div>
    <div>World Ocean Ambassadors Hangout · Green School Bali</div>
    <div style="margin-top:6px" id="footHelp">Questions? <a href="mailto:woahfestival@greenschool.org">woahfestival@greenschool.org</a></div>
  </div>
</footer>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
const API = 'https://script.google.com/macros/s/AKfycbzAV1IE_Y6-IlgkQh3MGRTc6aspuaZSu00y5QXu_8R8e1nTgch3XUhUyFR2wdqgZICg/exec';
const LOW = 3;
const SWATCH = { white: '#FFFFFF', black: '#111418', green: '#2E8B57', blue: '#1F6FD1', navy: '#0B2545', red: '#D7263D', grey: '#9AA5AB', gray: '#9AA5AB', pink: '#F49AC1', yellow: '#FFC61E', orange: '#FF7A4D', purple: '#7B5CD6', brown: '#7A5230', beige: '#E8DCC2', cream: '#F4EBD9', sand: '#E5D3B3', teal: '#35D6CE', olive: '#708238', khaki: '#BDB07A', charcoal: '#36454F', maroon: '#7A1E2C' };
const ARROW_L = '<svg viewBox="0 0 70 14" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><circle cx="3" cy="7" r="2" fill="currentColor" stroke="none"/><path d="M3 7h64M48 2l5 5-5 5M56 2l5 5-5 5"/></svg>';
const ARROW_R = '<svg viewBox="0 0 70 14" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><circle cx="67" cy="7" r="2" fill="currentColor" stroke="none"/><path d="M3 7h64M9 2l5 5-5 5M17 2l5 5-5 5"/></svg>';
let CAT = null, STATE = {};

function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function rp(n) { return Number(n || 0).toLocaleString('en-US') + ' IDR'; }
function toast(t) { const el = document.getElementById('toast'); el.textContent = t; el.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('on'), 3200); }
function title(h, sub, p) { return `<div class="title"><h2>${ARROW_L}<span>${h}</span>${ARROW_R}</h2>${sub ? `<div class="sub">${sub}</div>` : ''}${p ? `<p>${p}</p>` : ''}</div>`; }

// ---- data: show the last catalogue straight away, then fetch the fresh one ----
function load() {
  try { const c = JSON.parse(localStorage.getItem('woahShopCat') || 'null'); if (c && c.products) { CAT = c; route(); } } catch (e) {}
  if (!CAT) route();
  return fetch(API, { method: 'POST', credentials: 'omit', redirect: 'follow', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action: 'shop' }) })
    .then(r => r.json()).then(res => {
      if (!res.ok) throw new Error(res.error || 'The shop couldn\'t load');
      const changed = JSON.stringify(res.data.products) !== JSON.stringify(CAT && CAT.products);
      CAT = res.data; try { localStorage.setItem('woahShopCat', JSON.stringify(CAT)); } catch (e) {}
      if (changed) route(true);
      drawFooter();
    }).catch(err => { if (!CAT) { document.getElementById('view').innerHTML = `<div class="wrap err"><div class="empty"><b>The shop couldn't load right now.</b><br>${esc(err.message)}<br><br><button class="btn solid" onclick="load()">Try again</button></div></div>`; } });
}

// ---- helpers about products ----
function stockOf(p) { return p.variants.reduce((s, v) => s + (v.stock || 0), 0); }
function cover(p) { return p.photos && p.photos[0]; }
function priceRange(p, vs) { const ps = (vs || p.variants).map(v => v.price).filter(Boolean); if (!ps.length) return ''; const a = Math.min(...ps), b = Math.max(...ps); return a === b ? rp(a) : rp(a).replace(' IDR', '') + ' – ' + rp(b); }
function sizeRange(p) { return p.sizes.length > 1 ? 'Sizes ' + p.sizes[0] + '–' + p.sizes[p.sizes.length - 1] : p.sizes.length ? 'Size ' + p.sizes[0] : ''; }
function listAnd(a) { return a.length > 1 ? a.slice(0, -1).join(', ') + ' & ' + a[a.length - 1] : (a[0] || ''); }
function artHTML(p) { return `<div class="art"><div class="scrap"><b>${esc(p.name).replace(/-/g, '\u2011')}</b></div><small>Photo coming soon</small></div>`; }
function swatch(c) { return SWATCH[String(c).toLowerCase()] || '#ccc'; }

function cardHTML(p) {
  const cur = p.section === 'current', left = stockOf(p), out = cur && left <= 0, low = cur && !out && left <= LOW;
  const tag = p.section === 'preorder' ? '<span class="tag pre">Pre-order</span>' : out ? '<span class="tag out">Sold out</span>' : low ? `<span class="tag low">Only ${left} left</span>` : '';
  const c = cover(p);
  const meta = [p.colours.length ? 'Available in ' + listAnd(p.colours) : '', p.fits.length > 1 ? listAnd(p.fits) : ''].filter(Boolean).join(' · ');
  const line2 = [priceRange(p), sizeRange(p)].filter(Boolean).map(x => `<span style="white-space:nowrap">${esc(x)}</span>`).join(' | ');
  return `<a class="pc fade ${out ? 'soldout' : ''}" href="#/p/${encodeURIComponent(p.key)}">
    <div class="ph">${c ? `<img src="${esc(c.thumb.replace(/=w\d+$/, '=w700'))}" alt="${esc(p.name)}" loading="lazy">` : artHTML(p)}${tag}</div>
    <div class="nm">${esc(p.name)}</div>${meta ? `<div class="meta">${esc(meta)}</div>` : ''}<div class="pr">${line2}</div></a>`;
}

// ---- pages ----
function home(focus, keep) {
  product.last = null; pageShell.last = null;
  const ps = CAT ? CAT.products : null;
  const cur = ps ? ps.filter(p => p.section === 'current') : [], pre = ps ? ps.filter(p => p.section === 'preorder') : [];
  const sk = '<div class="sk"></div>'.repeat(4);
  cur.sort((a, b) => (stockOf(b) > 0) - (stockOf(a) > 0));
  document.getElementById('view').innerHTML = `
    <section class="hero"><div class="wrap">
      <div class="pre">Our merch is designed and sold by students</div>
      <h1>WOAH Shop</h1>
      <p>Wear your love for the ocean. Grab what's in stock now, or pre-order the new designs before they land. Every piece helps make the festival happen.</p>
      <div class="cta"><a class="btn light" href="#/current">Shop now</a><a class="btn light" href="#/preorder">Pre-order</a></div>
    </div></section>
    ${pre.length ? `<div class="band"><a class="paper" href="#/preorder"><span>New drops: <u>pre‑order</u> yours now!</span></a></div>` : ''}
    <main class="wrap">
      <section class="sec" id="current">${title('Shop now', 'In stock and ready to collect')}
        <div class="grid">${ps ? (cur.length ? cur.map(cardHTML).join('') : '<div class="empty">Nothing in stock right now. Check the pre-orders below.</div>') : sk}</div></section>
      <section class="sec" id="preorder">${title('Pre-order', 'Coming soon', 'Order now and we\'ll let you know when it arrives. No stock limits: everyone who orders gets one.')}
        <div class="grid">${ps ? (pre.length ? pre.map(cardHTML).join('') : '<div class="empty">No pre-orders open right now.</div>') : sk}</div></section>
    </main>`;
  document.title = 'WOAH Shop · WOAH Festival merch';
  if (focus) { const el = document.getElementById(focus); if (el) setTimeout(() => el.scrollIntoView(), 30); } else if (!keep) window.scrollTo(0, 0);
}

function product(key) {
  if (!CAT) { document.getElementById('view').innerHTML = '<div class="wrap"><div class="pp" style="margin-top:60px"><div class="sk" style="aspect-ratio:4/5"></div><div class="sk" style="aspect-ratio:4/3"></div></div></div>'; return; }
  const p = CAT.products.find(x => x.key === key);
  if (!p) { document.getElementById('view').innerHTML = '<div class="wrap"><a class="back" href="#/">← Back to the shop</a><div class="empty">This item isn\'t in the shop any more.</div></div>'; return; }
  const S = STATE[key] = STATE[key] || { img: 0, qty: 1 };
  const cur = p.section === 'current';
  const avail = v => !cur || (v.stock || 0) > 0;
  if (S.colour == null) S.colour = p.colours.find(c => p.variants.some(v => v.colour === c && avail(v))) || p.colours[0] || '';
  if (S.fit && !p.variants.some(v => v.fit === S.fit && (!p.colours.length || v.colour === S.colour) && avail(v))) S.fit = null;
  if (S.fit == null) S.fit = p.fits.find(f => p.variants.some(v => v.fit === f && (!S.colour || v.colour === S.colour) && avail(v))) || p.fits[0] || '';
  const match = v => (!p.colours.length || v.colour === S.colour) && (!p.fits.length || v.fit === S.fit);
  const vs = p.variants.filter(match);
  if (!p.sizes.length) S.size = '';
  else if (S.size && !vs.some(x => x.size === S.size)) S.size = null;
  const chosen = vs.find(v => v.size === S.size) || (p.sizes.length ? null : vs[0]);
  if (chosen && !avail(chosen)) S.size = null;
  const v = vs.find(x => x.size === S.size) || (p.sizes.length ? null : vs[0]);
  const photos = p.photos || [];
  if (S.img >= photos.length) S.img = 0;
  const ph = photos[S.img];
  const price = v ? rp(v.price) : priceRange(p, vs);
  let stockLine = '';
  if (cur && v) stockLine = v.stock <= 0 ? '<div class="stockline out">Sold out in this option</div>' : v.stock <= LOW ? `<div class="stockline low">Only ${v.stock} left</div>` : '<div class="stockline ok">In stock</div>';
  if (S.qty > (cur && v ? Math.max(1, v.stock) : 10)) S.qty = cur && v ? Math.max(1, v.stock) : 10;
  const colourChips = p.colours.length ? `<div class="opt"><div class="lbl">Colour <span>${esc(S.colour)}</span></div><div class="chips">${p.colours.map(c => {
      const ok = p.variants.some(x => x.colour === c && avail(x));
      return `<button class="chip ${S.colour === c ? 'on' : ''}" ${ok ? '' : 'disabled'} onclick="pick('${esc(key)}','colour','${esc(c)}')"><span class="sw" style="background:${swatch(c)}"></span>${esc(c)}</button>`; }).join('')}</div></div>` : '';
  const fitChips = p.fits.length > 1 ? `<div class="opt"><div class="lbl">Fit <span>${esc(S.fit)}</span></div><div class="chips">${p.fits.map(f => {
      const ok = p.variants.some(x => x.fit === f && (!p.colours.length || x.colour === S.colour) && avail(x));
      return `<button class="chip ${S.fit === f ? 'on' : ''}" ${ok ? '' : 'disabled'} onclick="pick('${esc(key)}','fit','${esc(f)}')">${esc(f)}</button>`; }).join('')}</div></div>` : '';
  const sizes = p.sizes.filter(z => vs.some(x => x.size === z));
  const sizeChips = sizes.length ? `<div class="opt"><div class="lbl">Size <span>${S.size ? esc(S.size) : 'Pick a size'}</span></div><div class="chips">${sizes.map(z => {
      const x = vs.find(y => y.size === z), ok = x && avail(x), diff = x && vs.some(y => y.price !== x.price);
      return `<button class="chip ${S.size === z ? 'on' : ''}" ${ok ? '' : 'disabled'} onclick="pick('${esc(key)}','size','${esc(z)}')">${esc(z)}${diff ? `<small>${esc(Number(x.price).toLocaleString('en-US'))}</small>` : ''}</button>`; }).join('')}</div></div>` : '';
  const can = v && avail(v);
  const anim = product.last !== key; product.last = key;
  document.getElementById('view').innerHTML = `<div class="wrap ${anim ? 'fade' : ''}">
    <a class="back" href="#/${p.section === 'preorder' ? 'preorder' : 'current'}">← Back to the shop</a>
    <div class="pp">
      <div class="gal"><div class="main">${ph ? `<img src="${esc(ph.url)}" alt="${esc(p.name)}">` : artHTML(p)}
        ${photos.length > 1 ? `<button class="nav l" aria-label="Previous photo" onclick="img('${esc(key)}',-1)">‹</button><button class="nav r" aria-label="Next photo" onclick="img('${esc(key)}',1)">›</button>` : ''}</div>
        ${photos.length > 1 ? `<div class="thumbs">${photos.map((x, i) => `<button class="${i === S.img ? 'on' : ''}" onclick="img('${esc(key)}',${i - S.img})" aria-label="Photo ${i + 1}"><img src="${esc(x.thumb)}" alt=""></button>`).join('')}</div>` : ''}</div>
      <div>
        <div class="kick">${p.section === 'preorder' ? 'Pre-order' : 'In stock'}</div>
        <h1>${esc(p.name).replace(/-/g, '\u2011')}</h1>
        <div class="price">${price}</div>
        ${p.desc ? `<p class="desc">${esc(p.desc)}</p>` : ''}
        ${colourChips}${fitChips}${sizeChips}
        ${stockLine}
        <div class="opt"><div class="lbl">Quantity</div><div class="qty"><button aria-label="One less" onclick="qty('${esc(key)}',-1)">−</button><span>${S.qty}</span><button aria-label="One more" onclick="qty('${esc(key)}',1)">+</button></div></div>
        <div class="buy"><button class="btn solid" ${canOrder() && can ? '' : 'disabled'} onclick="addToBag('${esc(key)}')">${!canOrder() ? 'Ordering opens soon' : !v ? 'Pick a size' : !can ? 'Sold out' : (p.section === 'preorder' ? 'Pre-order' : 'Add to bag') + ' · ' + rp(v.price * S.qty)}</button></div>
        ${p.section === 'preorder' ? '<div class="note"><b>How pre-orders work:</b> you order and pay now, we order enough for everyone, and we let you know when yours is ready to collect.</div>' : '<div class="note">Collect at Green School Bali. We\'ll tell you where and when after you order.</div>'}
      </div>
    </div></div>`;
  document.title = p.name + ' · WOAH Shop';
}
function pick(key, what, val) { STATE[key][what] = val; product(key); }
function img(key, by) { const p = CAT.products.find(x => x.key === key), n = (p.photos || []).length; if (!n) return; STATE[key].img = (STATE[key].img + by + n) % n; product(key); }
function qty(key, by) { STATE[key].qty = Math.max(1, STATE[key].qty + by); product(key); }


// ================= bag, checkout, accounts, my orders =================
const PAY = {
  qris: { t: 'QRIS', d: 'Scan with any banking or e-wallet app (GoPay, OVO, DANA, bank apps…).' },
  xendit: { t: 'Card / e-wallet (Xendit)', d: 'Pay online by card or e-wallet on the WOAH payment page.' },
  transfer: { t: 'Bank transfer', d: 'Transfer to the WOAH account. The details show below.' },
  cash: { t: 'Cash at pick-up', d: 'Pay in cash when you collect.' }
};
const ROLES = ['Student', 'Parent', 'Staff', 'Other'];
let BAG = [], TOKEN = '', ACC = null, CK = { mode: 'guest', pay: '', collect: '', role: 'Student' }, BUSY = false;
try { BAG = JSON.parse(localStorage.getItem('woahBag') || '[]'); TOKEN = localStorage.getItem('woahShopToken') || ''; ACC = JSON.parse(localStorage.getItem('woahShopAcc') || 'null'); } catch (e) {}
function saveBag() { try { localStorage.setItem('woahBag', JSON.stringify(BAG)); } catch (e) {} drawBagCount(); }
function drawBagCount() { const n = BAG.reduce((s, l) => s + l.qty, 0), el = document.getElementById('bagN'); if (el) el.textContent = n; }
function canOrder() { return !!(CAT && CAT.settings && CAT.settings.open); }
function phoneText() { const n = settings().whatsapp; return n ? '+' + n.replace(/^(\d{2})(\d{3})(\d{4})(\d+)$/, '$1 $2 $3 $4') : ''; }
function contactLine(order) {
  const ph = phoneText();
  return `For any changes or inquiries${order ? ' about <b>' + esc(order) + '</b>' : ''}, email us at <a href="mailto:${esc(settings().contact)}">${esc(settings().contact)}</a>${ph ? ` or text us on ${esc(ph)}` : ''}.`;
}
function contactHTML(order, short) { return `<div class="help${short ? ' sm' : ''}">${contactLine(order)}</div>`; }
function drawFooter() { const el = document.getElementById('footHelp'); if (el) el.innerHTML = contactLine(''); }
function settings() { return (CAT && CAT.settings) || { collect: { spirit: 'Spirit Friday', shanti: 'Shanti House' }, contact: 'woahfestival@greenschool.org' }; }
function api(body) {
  return fetch(API, { method: 'POST', credentials: 'omit', redirect: 'follow', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body) })
    .then(r => r.json()).then(res => { if (!res.ok) throw new Error(res.error || 'Something went wrong. Please try again.'); return res.data; });
}
function optText(l) { return [l.colour, l.fit, l.size].filter(Boolean).join(' · '); }
function lineInfo(l) {
  const p = CAT && CAT.products.find(x => x.key === l.key);
  const v = p && p.variants.find(x => (x.colour || '') === (l.colour || '') && (x.fit || '') === (l.fit || '') && (x.size || '') === (l.size || ''));
  const cur = p && p.section === 'current';
  const left = cur && v ? (v.stock || 0) : 99;
  return { p, v, cur, left, ok: !!(p && v && v.price > 0 && (!cur || left >= l.qty)) };
}
function bagLinesFor(key, l) { return BAG.filter(x => x.key === key && x.colour === l.colour && x.fit === l.fit && x.size === l.size).reduce((s, x) => s + x.qty, 0); }

function addToBag(key) {
  const S = STATE[key], p = CAT.products.find(x => x.key === key);
  const l = { key, colour: p.colours.length ? S.colour : '', fit: p.fits.length ? S.fit : '', size: p.sizes.length ? S.size : '', qty: S.qty };
  if (p.sizes.length && !l.size) { toast('Pick a size first.'); return; }
  const i = lineInfo(l);
  if (!i.v) { toast('That option isn\'t available.'); return; }
  const have = bagLinesFor(key, l);
  if (i.cur && have + l.qty > i.left) { toast(i.left - have > 0 ? `Only ${i.left - have} more available.` : 'You already have all that\'s left in your bag.'); return; }
  const ex = BAG.find(x => x.key === key && x.colour === l.colour && x.fit === l.fit && x.size === l.size);
  if (ex) ex.qty = Math.min(10, ex.qty + l.qty); else BAG.push(l);
  saveBag();
  const el = document.getElementById('toast');
  el.innerHTML = `Added to your bag · <a href="#/bag" style="color:var(--pale)">View bag</a>`; el.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('on'), 3800);
}
function bagQty(i, by) { const l = BAG[i]; if (!l) return; const info = lineInfo(l); let q = l.qty + by; if (info.cur && q > info.left) { toast(`Only ${info.left} available.`); q = info.left; } l.qty = Math.max(1, Math.min(10, q)); saveBag(); bagPage(); }
function bagDel(i) { BAG.splice(i, 1); saveBag(); bagPage(); }
function bagTotal() { return BAG.reduce((s, l) => { const i = lineInfo(l); return s + (i.v ? i.v.price * l.qty : 0); }, 0); }

function thumbOf(p) { const c = p && cover(p); return c ? `<img src="${esc(c.thumb)}" alt="">` : `<div class="mini-art">${esc(p ? p.name : '?')}</div>`; }
function bagLineHTML(l, i, edit) {
  const inf = lineInfo(l), p = inf.p;
  const warn = !p ? 'No longer in the shop' : !inf.v ? 'This option isn\'t available any more' : (inf.cur && inf.left < l.qty) ? (inf.left > 0 ? `Only ${inf.left} left` : 'Sold out') : '';
  return `<div class="bl">
    <a class="bl-ph" href="#/p/${encodeURIComponent(l.key)}">${thumbOf(p)}</a>
    <div class="bl-info"><div class="bl-nm">${esc(p ? p.name : l.key)}</div><div class="bl-op">${esc(optText(l))}</div>
      <div class="bl-ty">${p && p.section === 'preorder' ? 'Pre-order' : 'In stock'}${warn ? ` · <b class="bad">${esc(warn)}</b>` : ''}</div>
      ${edit ? `<div class="bl-act"><div class="qty sm"><button aria-label="One less" onclick="bagQty(${i},-1)">−</button><span>${l.qty}</span><button aria-label="One more" onclick="bagQty(${i},1)">+</button></div><button class="lnk" onclick="bagDel(${i})">Remove</button></div>` : `<div class="bl-op">Qty ${l.qty}</div>`}</div>
    <div class="bl-pr">${inf.v ? rp(inf.v.price * l.qty) : ''}</div></div>`;
}
function pageShell(h, sub, body) { product.last = null; const same = pageShell.last === location.hash, y = window.scrollY; pageShell.last = location.hash; document.getElementById('view').innerHTML = `<main class="wrap narrow ${same ? '' : 'fade'}">${title(h, sub)}${body}</main>`; window.scrollTo(0, same ? y : 0); }

function bagPage() {
  if (!CAT) { pageShell('Your bag', '', '<div class="sk" style="aspect-ratio:3/1"></div>'); return; }
  BAG = BAG.filter(l => l.qty > 0);
  if (!BAG.length) { pageShell('Your bag', '', `<div class="empty">Your bag is empty.<br><br><a class="btn solid" href="#/">Go shopping</a></div>`); return; }
  const bad = BAG.some(l => !lineInfo(l).ok);
  pageShell('Your bag', BAG.reduce((s, l) => s + l.qty, 0) + ' item' + (BAG.reduce((s, l) => s + l.qty, 0) > 1 ? 's' : ''), `
    <div class="box">${BAG.map((l, i) => bagLineHTML(l, i, true)).join('')}
      <div class="tot"><span>Total</span><b>${rp(bagTotal())}</b></div></div>
    ${bad ? '<div class="note warnbox">Something in your bag needs a change before you can check out (see the red notes above).</div>' : ''}
    <div class="row-btns"><a class="btn" href="#/">Keep shopping</a>${canOrder() ? `<a class="btn solid ${bad ? 'dis' : ''}" href="${bad ? 'javascript:void 0' : '#/checkout'}">Check out</a>` : '<button class="btn solid" disabled>Ordering opens soon</button>'}</div>`);
}

// ---- accounts ----
function setAcc(token, acc) { TOKEN = token || ''; ACC = acc || null; try { if (TOKEN) { localStorage.setItem('woahShopToken', TOKEN); localStorage.setItem('woahShopAcc', JSON.stringify(ACC)); } else { localStorage.removeItem('woahShopToken'); localStorage.removeItem('woahShopAcc'); } } catch (e) {} }
function logout() { const t = TOKEN; setAcc('', null); if (t) api({ action: 'shopAccount', op: 'logout', token: t }).catch(() => {}); route(); }
function val(id) { const el = document.getElementById(id); return el ? el.value.trim() : ''; }
function msg(id, t, bad) { const el = document.getElementById(id); if (el) { el.className = 'fmsg' + (bad ? ' bad' : ''); el.textContent = t; } }
function doLogin(after) {
  if (BUSY) return; BUSY = true; msg('accMsg', 'Logging in…');
  api({ action: 'shopAccount', op: 'login', id: val('liId'), password: document.getElementById('liPw').value })
    .then(d => { setAcc(d.token, d.account); BUSY = false; toast('Welcome back, ' + (d.account.name || '').split(' ')[0] + '!'); after(); })
    .catch(e => { BUSY = false; msg('accMsg', e.message, true); });
}
function doSignup(after) {
  if (BUSY) return; BUSY = true; msg('accMsg', 'Creating your account…');
  api({ action: 'shopAccount', op: 'signup', name: val('fName'), cemail: val('fEmail'), phone: val('fPhone'), password: document.getElementById('fPw').value })
    .then(d => { setAcc(d.token, d.account); BUSY = false; toast('Account created!'); after(); })
    .catch(e => { BUSY = false; msg('accMsg', e.message, true); });
}
function loginHTML(after) {
  return `<div class="field"><label for="liId">Email or phone</label><input id="liId" autocomplete="username"></div>
    <div class="field"><label for="liPw">Password</label><input id="liPw" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin(${after})"></div>
    <button class="btn solid wide" onclick="doLogin(${after})">Log in</button>
    <div class="hint">Forgot your password? Email ${esc(settings().contact)} and we'll sort it out.</div>`;
}

// ---- checkout ----
function ckSet(k, v) { CK[k] = v; checkoutPage(true); }
function ckKeep() { ['fName', 'fEmail', 'fPhone', 'fNote'].forEach(id => { const el = document.getElementById(id); if (el) CK[id] = el.value; }); }
function checkoutPage(keep) {
  if (!CAT) { pageShell('Checkout', '', '<div class="sk" style="aspect-ratio:3/1"></div>'); return; }
  if (keep) ckKeep();
  if (!BAG.length) { location.hash = '#/bag'; return; }
  if (!canOrder()) { pageShell('Checkout', '', '<div class="empty">Ordering isn\'t open yet. Please check back soon!</div>'); return; }
  if (BAG.some(l => !lineInfo(l).ok)) { location.hash = '#/bag'; return; }
  const s = settings(), y = window.scrollY; CK.rendered = true;
  const who = ACC ? `<div class="box acc"><div>Ordering as <b>${esc(ACC.name)}</b><br><span class="muted">${esc([ACC.email, ACC.phone ? '+' + ACC.phone : ''].filter(Boolean).join(' · '))}</span></div><button class="lnk" onclick="logout()">Log out</button></div>`
    : `<div class="tabs">${[['guest', 'Guest'], ['login', 'Log in'], ['signup', 'Create account']].map(([k, l]) => `<button class="${CK.mode === k ? 'on' : ''}" onclick="ckSet('mode','${k}')">${l}</button>`).join('')}</div>
      <div class="box">${CK.mode === 'login' ? loginHTML('checkoutPage') : `
        <div class="field"><label for="fName">Your name *</label><input id="fName" autocomplete="name" value="${esc(CK.fName || '')}"></div>
        <div class="two"><div class="field"><label for="fEmail">Email</label><input id="fEmail" type="email" autocomplete="email" value="${esc(CK.fEmail || '')}"></div>
          <div class="field"><label for="fPhone">Phone / WhatsApp</label><input id="fPhone" type="tel" autocomplete="tel" placeholder="08…" value="${esc(CK.fPhone || '')}"></div></div>
        <div class="hint">We need an email or a phone number (or both) to reach you about your order.</div>
        ${CK.mode === 'signup' ? `<div class="field"><label for="fPw">Choose a password *</label><input id="fPw" type="password" autocomplete="new-password" placeholder="At least 6 characters"></div><button class="btn wide" onclick="doSignup(()=>checkoutPage(true))">Create account</button>` : ''}`}
        <div class="fmsg" id="accMsg"></div></div>`;
  const showForm = ACC || CK.mode === 'guest';
  pageShell('Checkout', 'Almost done', `
    <div class="ck">
      <div>
        <h3 class="h3">1 · Your details</h3>${who}
        ${showForm ? `
        <div class="field"><label>I am a…</label><div class="chips">${ROLES.map(r => `<button class="chip ${CK.role === r ? 'on' : ''}" onclick="ckSet('role','${r}')">${r}</button>`).join('')}</div></div>
        <h3 class="h3">2 · Where will you collect?</h3>
        <div class="cards">${Object.keys(s.collect).map(k => `<button class="rc ${CK.collect === k ? 'on' : ''}" onclick="ckSet('collect','${k}')"><b>${esc(k === 'spirit' ? 'Spirit Friday' : 'Shanti House')}</b><span>${esc(s.collect[k])}</span></button>`).join('')}</div>
        <h3 class="h3">3 · How will you pay?</h3>
        <div class="cards">${Object.keys(PAY).filter(k => k !== 'transfer' || s.bank).map(k => `<button class="rc ${CK.pay === k ? 'on' : ''}" onclick="ckSet('pay','${k}')"><b>${PAY[k].t}</b><span>${PAY[k].d}</span></button>`).join('')}</div>
        ${CK.pay && CK.pay !== 'cash' ? `<h3 class="h3">4 · Pay, then upload your screenshot</h3>${payInfo(CK.pay, bagTotal(), esc((ACC ? ACC.name : CK.fName) || 'your name'))}
          <div class="proof"><label class="btn wide ${CK.proof ? '' : 'solid'}">${CK.proof ? 'Change screenshot' : 'Upload payment screenshot *'}<input type="file" accept="image/*" hidden onchange="ckProof(this)"></label>
          ${CK.proof ? `<div class="proofok"><img src="${CK.proof.data}" alt="Your payment screenshot"><span>Screenshot added ✓</span></div>` : '<div class="hint">We need a screenshot of your payment to confirm it. Your order is placed once it\'s uploaded.</div>'}<div class="fmsg" id="prMsg"></div></div>` : ''}
        <div class="field" style="margin-top:18px"><label for="fNote">Anything we should know? (optional)</label><textarea id="fNote" rows="2" placeholder="e.g. it's a gift, or which Spirit Friday suits you">${esc(CK.fNote || '')}</textarea></div>
        <input type="text" id="fWeb" name="website" tabindex="-1" autocomplete="off" style="position:absolute;left:-9999px" aria-hidden="true">` : ''}
      </div>
      <aside class="box sum"><h3 class="h3" style="margin-top:0">Your order</h3>${BAG.map((l, i) => bagLineHTML(l, i, false)).join('')}
        <div class="tot"><span>Total</span><b>${rp(bagTotal())}</b></div>
        ${BAG.some(l => lineInfo(l).p.section === 'preorder') ? '<div class="hint">Pre-order items are ordered for you and we\'ll tell you when they\'re ready to collect.</div>' : ''}
        ${showForm ? `<button class="btn solid wide" id="placeBtn" onclick="placeOrder()">Place order · ${rp(bagTotal())}</button><div class="fmsg" id="ckMsg"></div>` : '<div class="hint">Log in or pick Guest to continue.</div>'}
        <a class="lnk" href="#/bag">← Edit bag</a></aside>
    </div>`);
  if (keep) window.scrollTo(0, y);
}
function ckProof(input) {
  const f = input.files && input.files[0]; input.value = ''; if (!f) return;
  msg('prMsg', 'Adding…');
  shrinkImg(f).then(r => { CK.proof = r; checkoutPage(true); }).catch(e => msg('prMsg', e.message, true));
}
function placeOrder() {
  if (BUSY) return;
  ckKeep();
  const buyer = ACC ? { name: ACC.name, cemail: ACC.email, phone: ACC.phone, role: CK.role } : { name: (CK.fName || '').trim(), cemail: (CK.fEmail || '').trim(), phone: (CK.fPhone || '').trim(), role: CK.role };
  if (buyer.name.length < 2) return msg('ckMsg', 'Please type your name.', true);
  if (!buyer.cemail && buyer.phone.replace(/\D/g, '').length < 8) return msg('ckMsg', 'Please give your email or phone number.', true);
  if (!CK.collect) return msg('ckMsg', 'Pick where you\'ll collect.', true);
  if (!CK.pay) return msg('ckMsg', 'Pick how you\'ll pay.', true);
  if (CK.pay !== 'cash' && !CK.proof) return msg('ckMsg', 'Please pay first and upload a screenshot of the payment.', true);
  BUSY = true; msg('ckMsg', 'Placing your order…'); const b = document.getElementById('placeBtn'); if (b) b.disabled = true;
  api({ action: 'shopOrder', buyer, pay: CK.pay, collect: CK.collect, note: CK.fNote || '', cart: BAG, token: TOKEN || undefined, website: val('fWeb'), proof: CK.pay !== 'cash' && CK.proof ? { type: CK.proof.type, data: CK.proof.data } : undefined })
    .then(d => {
      BUSY = false; BAG = []; saveBag(); CK.proof = null;
      d.contact = buyer.cemail || buyer.phone;
      try { localStorage.setItem('woahLastOrder', JSON.stringify(d)); } catch (e) {}
      CAT && load();
      location.hash = '#/done/' + d.order;
    })
    .catch(e => { BUSY = false; if (b) b.disabled = false; msg('ckMsg', e.message, true); });
}

// ---- after ordering + paying ----
function payInfo(pay, total, ref) {
  const s = settings(), amt = Number(total).toLocaleString('en-US');
  if (/cash/i.test(pay)) return `<div class="note">Pay <b>${rp(total)}</b> in cash when you collect.</div>`;
  if (/qris/i.test(pay)) return `<div class="paybox"><img class="qr" src="img/qris.png" alt="WOAH QRIS code" width="240" height="240"><div><b>Scan to pay ${rp(total)}</b><br>Open any banking or e-wallet app, scan the code and type <b>${amt}</b> as the amount. It pays to Yayasan Kul Kul (Green School). If there's a note field, write <b>${ref}</b>.</div></div>`;
  if (/xendit|card/i.test(pay)) return `<div class="paybox"><div><b>Pay ${rp(total)} online</b><br>Open the WOAH payment page, type <b>${amt}</b> as the amount and add <b>${ref}</b> in the description.</div><a class="btn solid" href="${esc(s.xendit || '#')}" target="_blank" rel="noopener">Open payment page ↗</a></div>`;
  if (/transfer/i.test(pay)) return `<div class="paybox"><div><b>Transfer ${rp(total)}</b><br><div class="bank">${esc(s.bank || 'Bank details coming soon.')}</div>Put <b>${ref}</b> in the transfer note.</div></div>`;
  return '';
}
function payHTML(o, total, contact) {
  const ref = esc(o.order);
  if (/cash/i.test(o.pay || '')) return payInfo(o.pay, total, ref);
  const proofBox = `<div class="proof" id="proof-${ref}"><label class="btn wide">${o.proofSent ? 'Send another screenshot' : 'Upload payment screenshot'}<input type="file" accept="image/*" hidden onchange="sendProof('${ref}', this, '${esc(contact || '')}')"></label><div class="fmsg" id="pm-${ref}">${o.proofSent ? 'Screenshot received. We\'ll confirm your payment soon.' : 'After paying, send us the screenshot so we can match it to your order.'}</div></div>`;
  return payInfo(o.pay, total, ref) + proofBox;
}
function sendProof(order, input, contact) {
  const f = input.files && input.files[0]; input.value = ''; if (!f) return;
  msg('pm-' + order, 'Sending…');
  shrinkImg(f).then(s => api({ action: 'shopProof', order, contact, token: TOKEN || undefined, type: s.type, data: s.data }))
    .then(() => msg('pm-' + order, 'Got it, thanks! We\'ll confirm your payment soon.'))
    .catch(e => msg('pm-' + order, e.message, true));
}
function shrinkImg(file) {
  return new Promise((res, rej) => { const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => { const sc = Math.min(1, 1600 / Math.max(img.width, img.height)), c = document.createElement('canvas'); c.width = Math.round(img.width * sc); c.height = Math.round(img.height * sc);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url); res({ data: c.toDataURL('image/jpeg', 0.85), type: 'image/jpeg' }); };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('That file isn\'t a photo this browser can open.')); }; img.src = url; });
}
function itemsHTML(items) { return items.map(i => `<div class="oi"><span>${i.qty} × ${esc(i.product)}${optText(i) ? ' <span class="muted">(' + esc(optText(i)) + ')</span>' : ''}${i.type === 'Pre-order' ? ' <span class="pill">pre-order</span>' : ''}</span><span>${rp(i.price * i.qty)}</span></div>`).join(''); }
function donePage(id) {
  let d = null; try { d = JSON.parse(localStorage.getItem('woahLastOrder') || 'null'); } catch (e) {}
  if (!d || d.order !== id) { location.hash = '#/orders'; return; }
  pageShell('Thank you!', 'Order ' + d.order, `
    <div class="box">
      <p style="margin-top:0">Thanks ${esc(d.name.split(' ')[0])}! We've got your order. Keep your order number: <b class="big">${esc(d.order)}</b></p>
      ${itemsHTML(d.items)}<div class="tot"><span>Total</span><b>${rp(d.total)}</b></div>
      <div class="kv"><div><span>Collect at</span>${esc(d.collect)}</div><div><span>Payment</span>${esc(d.payText)}</div></div>
    </div>
    ${d.pay === 'cash' ? `<h3 class="h3">How to pay</h3>${payInfo('cash', d.total, '')}` : (d.paid === 'Proof sent' ? '<div class="note"><b>Payment screenshot received.</b> We\'ll check it and confirm your payment.</div>' : `<h3 class="h3">How to pay</h3>${payHTML({ order: d.order, pay: d.pay, proofSent: false }, d.total, d.contact)}`)}
    <div class="note">${d.items.some(i => i.type === 'Pre-order') ? 'Pre-order items: we\'ll let you know when they arrive and are ready to collect. ' : ''}You can check your order any time under <a href="#/orders">My orders</a> with your order number and ${d.email ? 'email' : 'phone'}.</div>${contactHTML(d.order)}`);
}

// ---- my orders ----
let LOOK = null;
function statusChip(s) { return `<span class="st st-${s.toLowerCase().replace(/[^a-z]+/g, '-')}">${esc(s)}</span>`; }
function orderCard(o, contact) {
  const needPay = o.paid !== 'Yes' && !/cash/i.test(o.pay) && o.status !== 'Cancelled';
  return `<div class="box oc"><div class="oc-h"><div><b class="big">${esc(o.order)}</b><div class="muted">${new Date(o.placed).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' })}</div></div>${statusChip(o.status)}</div>
    ${itemsHTML(o.items)}<div class="tot"><span>Total</span><b>${rp(o.total)}</b></div>
    <div class="kv"><div><span>Collect at</span>${esc(o.collect)}</div><div><span>Payment</span>${esc(o.pay)} · ${o.paid === 'Yes' ? '<b class="good">Paid</b>' : o.paid === 'Proof sent' ? 'Checking your payment' : /cash/i.test(o.pay) ? 'Pay at pick-up' : '<b class="bad">Not paid yet</b>'}</div></div>
    ${needPay ? `<details class="pay"><summary>How to pay</summary>${payHTML(o, o.total, contact)}</details>` : ''}${contactHTML(o.order, true)}</div>`;
}
function ordersPage() {
  if (TOKEN) {
    pageShell('My orders', ACC ? 'Hi ' + esc(ACC.name.split(' ')[0]) : '', '<div class="sk" style="aspect-ratio:3/1"></div>');
    api({ action: 'shopLookup', token: TOKEN }).then(d => {
      if (CAT) CAT.settings = Object.assign({}, CAT.settings, { bank: d.bank, xendit: d.xendit });
      document.querySelector('main').innerHTML = title('My orders', ACC ? 'Hi ' + esc(ACC.name.split(' ')[0]) : '') + (d.orders.length ? d.orders.map(o => orderCard(o, '')).join('') : '<div class="empty">No orders yet.<br><br><a class="btn solid" href="#/">Go shopping</a></div>') + `<div class="row-btns"><button class="lnk" onclick="logout()">Log out</button></div>`;
    }).catch(e => { if (/log in/i.test(e.message)) { setAcc('', null); ordersPage(); } else document.querySelector('main').innerHTML += `<div class="empty">${esc(e.message)}</div>`; });
    return;
  }
  pageShell('My orders', 'Find your order', `
    <div class="ck two-col">
      <div class="box"><h3 class="h3" style="margin-top:0">Look up an order</h3>
        <div class="field"><label for="lkO">Order number</label><input id="lkO" placeholder="WOAH-1001"></div>
        <div class="field"><label for="lkC">Email or phone you used</label><input id="lkC"></div>
        <button class="btn solid wide" onclick="lookUp()">Find my order</button><div class="fmsg" id="lkMsg"></div></div>
      <div class="box"><h3 class="h3" style="margin-top:0">Have an account?</h3>${loginHTML('ordersPage')}<div class="fmsg" id="accMsg"></div></div>
    </div><div id="lkOut"></div>${contactHTML('')}`);
}
function lookUp() {
  const o = val('lkO'), c = val('lkC');
  if (!o || !c) return msg('lkMsg', 'Type your order number and the email or phone you used.', true);
  msg('lkMsg', 'Looking…');
  api({ action: 'shopLookup', order: o, contact: c }).then(d => {
    msg('lkMsg', '');
    if (CAT) CAT.settings = Object.assign({}, CAT.settings, { bank: d.bank, xendit: d.xendit });
    document.getElementById('lkOut').innerHTML = d.orders.map(x => orderCard(x, c)).join('');
  }).catch(e => msg('lkMsg', e.message, true));
}

let LAST = '';
function route(fromData) {
  const h = location.hash.replace(/^#\/?/, '');
  const m = h.match(/^p\/(.+)$/);
  const dn = h.match(/^done\/(.+)$/);
  if (h !== 'checkout') CK.rendered = false;
  if (h === 'bag') bagPage();
  else if (h === 'checkout') { if (!fromData || !CK.rendered) checkoutPage(); }
  else if (dn) donePage(decodeURIComponent(dn[1]));
  else if (h === 'orders') { if (!fromData) ordersPage(); }
  else if (m) { const k = decodeURIComponent(m[1]); product(k); if (LAST !== h && !fromData) window.scrollTo(0, 0); }
  else home(!fromData && (h === 'current' || h === 'preorder') && LAST !== h ? h : null, fromData || LAST === h);
  LAST = h;
}
window.addEventListener('hashchange', () => { document.getElementById('toast').classList.remove('on'); route(); });
drawBagCount();
drawFooter();
load();
</script>
</body>
